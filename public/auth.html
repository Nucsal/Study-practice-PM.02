<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Страница авторизации</title>
    <link rel="stylesheet" href="article.css">
    <style>
        /* ==========================================================
   auth.css — страница авторизации / регистрации
   Подключать после bootstrap.min.css и style.css
   ========================================================== */

/* ---------- Каркас страницы ---------- */
body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  margin: 0;
  font-family: var(--font-family);
  color: var(--dark);
  background-color: var(--light);
}

main {
  flex: 1 0 auto;
}

/* ==========================================================
   ОБЁРТКА ФОРМЫ
   ========================================================== */
.div1 {
  display: flex;
  justify-content: center;
  align-items: center;
  flex: 1 0 auto;
  width: 100%;
  min-height: 100vh;
  padding: 40px 20px;
  box-sizing: border-box;
}

/* ==========================================================
   ФОРМА
   ========================================================== */
#form {
  display: flex;
  flex-direction: column;
  gap: 18px;
  width: 100%;
  max-width: 460px;
  padding: 40px 36px;
  background-color: var(--light-bg);
  border-radius: 30px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.12);
}

/* Заголовок-акцент сверху формы (опционально, если добавите <h2>) */
#form h2 {
  margin: 0 0 8px;
  font-size: clamp(24px, 3vw, 32px);
  font-weight: 700;
  line-height: 1.2;
  text-align: center;
  color: var(--dark);
}

#form h2::after {
  content: "";
  display: block;
  width: 60px;
  height: 5px;
  margin: 16px auto 0;
  background-color: var(--primary);
  border-radius: 50px;
}

/* ==========================================================
   ПОЛЯ ВВОДА
   ========================================================== */
#email,
#password {
  display: block;
  width: 100%;
  padding: 18px 22px;
  font-family: inherit;
  font-size: 16px;
  line-height: 1.5;
  color: var(--dark);
  background-color: #fff;
  border: 2px solid rgba(0, 0, 0, 0.12);   /* постоянная обводка */
  border-radius: 20px;
  outline: none;
  box-sizing: border-box;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

#email::placeholder,
#password::placeholder {
  color: #b3a49a;
}

/* Наведение — обводка синеет */
#email:hover,
#password:hover {
  border-color: rgba(37, 99, 235, 0.55);   /* var(--blue) с прозрачностью */
}

/* Фокус — синяя обводка + свечение */
#email:focus,
#password:focus {
  border-color: var(--blue);
  box-shadow: 0 0 15px var(--blue-glow);
}

/* Невалидное значение — красная обводка */
#email:invalid:not(:placeholder-shown),
#password:invalid:not(:placeholder-shown) {
  border-color: rgba(220, 53, 69, 0.7);
}

/* Невалидное + фокус — красная обводка и красное свечение */
#email:invalid:not(:placeholder-shown):focus,
#password:invalid:not(:placeholder-shown):focus {
  border-color: #dc3545;
  box-shadow: 0 0 15px rgba(220, 53, 69, 0.35);
}

/* ==========================================================
   КНОПКИ
   ========================================================== */
:root {
  --blue: #2563eb;
  --blue-hover: #1d4ed8;
  --blue-glow: rgba(37, 99, 235, 0.45);
}

#form button {
  display: block;
  width: 100%;
  padding: 18px 40px;
  font-family: inherit;
  font-size: 18px;
  font-weight: 400;
  line-height: 1;
  cursor: pointer;
  border: none;
  border-radius: 50px;
  transition: color 0.2s ease, background-color 0.2s ease,
    box-shadow 0.2s ease, transform 0.2s ease;
}

/* Кнопка «Авторизироваться» (submit) — синяя заливка */
#form button[type="submit"] {
  color: #fff;
  background-color: var(--blue);
}

#form button[type="submit"]:hover {
  background-color: var(--blue-hover);
  box-shadow: 0 0 15px var(--blue-glow);
}

#form button[type="submit"]:active {
  transform: translateY(1px);
}

#form button[type="submit"]:focus-visible {
  outline: 2px solid var(--dark);
  outline-offset: 3px;
}

/* Кнопка «Зарегистрироваться» — тоже синий фон,
   но чуть светлее, чтобы визуально отличалась */
#regButton {
  color: #fff;
  background-color: var(--blue);
  opacity: 0.85;
}

#regButton:hover,
#regButton:focus-visible {
  opacity: 1;
  background-color: var(--blue-hover);
  box-shadow: 0 0 15px var(--blue-glow);
}

#regButton:active {
  transform: translateY(1px);
}

#regButton:focus-visible {
  outline: 2px solid var(--dark);
  outline-offset: 3px;
}

/* ==========================================================
   АДАПТИВ
   ========================================================== */
@media (max-width: 768px) {
  .div1 {
    padding: 24px 16px;
  }

  #form {
    padding: 28px 22px;
    gap: 14px;
    border-radius: 20px;
  }

  #email,
  #password {
    padding: 14px 18px;
    font-size: 15px;
    border-radius: 16px;
  }

  #form button {
    padding: 14px 24px;
    font-size: 16px;
  }
}

@media (max-width: 470px) {
  #form {
    padding: 22px 16px;
  }

  #form button {
    padding: 13px 20px;
    font-size: 15px;
  }
}
    </style>
</head>
<body>
    <div class="div1">
            <form id="form">
                <input type="email" id="email" placeholder="Введите email" required>
                <input type="password" id="password" placeholder="Введите пароль" required>
                <button type="submit">Авторизироваться</button>
                <button type="button" id="regButton">Зарегистрироваться</button>
            </form>
    </div>
    <script>
        document.getElementById("form").addEventListener("submit", async (event) => {
            event.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            try {
                const response = await fetch("/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({email:email, password:password})
            })
            const data = await response.json();
            alert(data.message);
            if (data.redirect) {
                window.location.href = data.redirect;
            }
            } catch (error) {
                alert("Ошибка: " + error.message);
            }
        });

        document.getElementById("regButton").addEventListener("click", async () => {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            console.log(email, password);
            try {
                const response = await fetch("/auth/registration", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({email:email, password:password})
                })
            const data = await response.json();
            alert(data.message);
            if (data.redirect) {
                window.location.href = data.redirect;
            }
            } catch (error) {
                alert("Ошибка: " + error.message);
            }
        });
    </script>
</body>
</html>
